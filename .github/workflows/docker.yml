name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Docker Hub 用户名是公开信息，直接写死；Token 只放 secret，不进仓库
      DOCKERHUB_IMAGE: docker.io/song19615/send-to-kindle
      # 中转一下：secrets 不能直接写在 if: 条件里
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: song19615
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 构建本身会真转一本 sample.epub 做自检，转换引擎有问题会直接失败
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关掉 provenance attestation：否则镜像索引里会多一个 unknown/unknown 条目，
          # 群晖/威联通上较老的 Docker（20.10 等）拉取时会报 no matching manifest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 把刚推到 ghcr 的镜像原样复制到 Docker Hub。
      # 不重新构建，只搬 manifest 和层，标签完全对应。
      # 没配 DOCKERHUB_TOKEN 时这一步会自动跳过，CI 不会因为缺 secret 变红。
      - name: 同步到 Docker Hub
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        run: |
          set -euo pipefail
          echo "${{ steps.meta.outputs.tags }}" | while read -r src; do
            [ -z "$src" ] && continue
            tag="${src##*:}"
            echo "==> $src  ->  ${DOCKERHUB_IMAGE}:${tag}"
            docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:${tag}" "$src"
          done

      - name: 汇总
        if: github.event_name != 'pull_request'
        run: |
          echo "ghcr:       ${{ env.GHCR_IMAGE }}"
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            echo "Docker Hub: $DOCKERHUB_IMAGE"
          else
            echo "Docker Hub: 未配置 DOCKERHUB_TOKEN，本次未同步"
          fi
