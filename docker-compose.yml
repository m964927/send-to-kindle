services:
  kindle-drop:
    build:
      context: .
      args:
        # 需要 epub→mobi、pdf/txt→azw3 时改成 "1"（镜像从 ~250MB 涨到 ~900MB）
        WITH_CALIBRE: "0"
        # NAS 拉 Docker Hub 慢时，换国内镜像源（注意必须保留 trixie，不能换成 bookworm）
        # NODE_IMAGE: docker.m.daocloud.io/library/node:22-trixie-slim
        # npm 装依赖慢时，换国内源
        # NPM_REGISTRY: https://registry.npmmirror.com
        # 拉不动 GitHub 时，换成镜像源
        # KINDLING_BASE: https://gh-proxy.com/https://github.com/ciscoriordan/kindling/releases/download
    image: kindle-drop:latest
    container_name: kindle-drop
    restart: unless-stopped

    ports:
      # 左侧是 NAS 上对外暴露的端口，被占用就改成 8900:8899
      - "8899:8899"

    environment:
      - TZ=Asia/Shanghai
      # 以下都是可选项，一个都不用填：
      # 页面地址默认跟随你浏览器访问的地址（局域网 IP、lucky 反代域名都自动正确）
      # - PUBLIC_URL=https://kindle.example.com   # 只在想钉死对外地址时才写
      # - AUTO_CONVERT=false
      # - KEEP_ORIGINAL=false
      # - KINDLING_BIN=/usr/local/bin/kindling

    volumes:
      # 书库、配置、索引都在这里，备份这个目录就等于备份整个书架
      - ./data:/app/data

    # J1900 四核；转换是单进程的，2 核 1G 上限足够，也不会拖垮 NAS
    cpus: 2.0
    mem_limit: 1g
